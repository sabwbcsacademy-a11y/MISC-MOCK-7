      { id: 100, q: "2026 সালের সেপ্টেম্বর অনুযায়ী ভারতের Chief Justice of India কে?", options: ["A) Justice B. R. Gavai", "B) Justice D. Y. Chandrachud", "C) Justice Surya Kant", "D) Justice Sanjiv Khanna"], answer: 2 }

    let timerInterval;
    let timeRemaining = 90 * 60; // 90 minutes
    let userData = { name: "", phone: "" };

    // --- STUDENT ELIGIBILITY VERIFICATION ---
    function verifyAndStart() {
      const name = document.getElementById("student-name").value.trim();
      const phone = document.getElementById("student-phone").value.trim();
      const err = document.getElementById("login-err");

      if (!name || !phone) {
        err.innerText = "Please fill in both Name and Mobile Number.";
        return;
      }

      if (!ALLOWED_NUMBERS.includes(phone)) {
        err.innerText = "Access Denied: Phone number not registered or eligible.";
        return;
      }

      // Check Local Attempts Count
      let localAttempts = parseInt(localStorage.getItem(`mock_attempts_${phone}`) || "0");

      if (localAttempts >= 25) {
        err.innerText = "Limit Reached: You have already attempted this test 25 times.";
        return;
      }

      const currentAttempt = localAttempts + 1;
      userData = { name, phone, attempts: currentAttempt };
      localStorage.setItem(`mock_attempts_${phone}`, currentAttempt.toString());

      document.getElementById("disp-name").innerText = name;
      document.getElementById("login-section").classList.add("hidden");
      document.getElementById("exam-section").classList.remove("hidden");

      renderQuestions();
      startTimer();
    }

    // --- RENDER EXAM ---
    function renderQuestions() {
      const form = document.getElementById("quiz-form");
      form.innerHTML = questions.map((q, i) => `
        <div class="q-card" id="q-card-${i}">
          <div class="q-title">${i + 1}. ${q.q}</div>
          <div class="options">
            ${q.options.map((opt, optIdx) => `
              <label>
                <input type="radio" name="q${i}" value="${optIdx}">
                ${opt}
              </label>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    // --- TIMER SYSTEM ---
    function startTimer() {
      timerInterval = setInterval(() => {
        timeRemaining--;
        let mins = Math.floor(timeRemaining / 60);
        let secs = timeRemaining % 60;
        document.getElementById("time-disp").innerText = 
          `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          alert("Time's up! Submitting your test automatically.");
          submitTest();
        }
      }, 1000);
    }

    // --- EVALUATION & SUBMISSION ---
    function submitTest() {
      clearInterval(timerInterval);

      let correct = 0;
      let wrong = 0;
      let unattempted = 0;
      const userAnswers = [];

      questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        if (selected) {
          const val = parseInt(selected.value);
          userAnswers.push(val);
          if (val === q.answer) correct++;
          else wrong++;
        } else {
          userAnswers.push(null);
          unattempted++;
        }
      });

      // Marks: +2 for correct, -0.5 for wrong
      const finalScore = (correct * 2) - (wrong * 0.5);

      document.getElementById("score-summary").innerHTML = `
        <p><strong>Candidate Name:</strong> ${userData.name}</p>
        <p><strong>Phone:</strong> ${userData.phone}</p>
        <p><strong>Attempt:</strong> ${userData.attempts} of 25</p>
        <p><strong>Final Score:</strong> ${finalScore} / 200</p>
        <p><strong>Correct (+2 each):</strong> ${correct}</p>
        <p><strong>Wrong (-0.5 each):</strong> ${wrong}</p>
        <p><strong>Unattempted:</strong> ${unattempted}</p>
      `;

      // Save result to Google Sheet
      saveToGoogleSheet({
        name: userData.name,
        phone: userData.phone,
        score: finalScore,
        correct: correct,
        wrong: wrong,
        unattempted: unattempted,
        attemptNumber: userData.attempts
      });

      renderReview(userAnswers);
      renderAnswerTable();

      document.getElementById("exam-section").classList.add("hidden");
      document.getElementById("result-section").classList.remove("hidden");
    }

    // --- SAVE RESULT DATA TO GOOGLE SHEETS ---
    function saveToGoogleSheet(data) {
      fetch(GOOGLE_SHEET_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      }).catch(err => console.error("Error pushing result to Google Sheets:", err));
    }

    // --- RENDER PREVIEW & MASTER ANSWER KEY TABLE ---
    function renderReview(userAnswers) {
      const container = document.getElementById("review-questions");
      container.innerHTML = questions.map((q, i) => {
        const userAns = userAnswers[i];
        return `
          <div class="q-card">
            <div class="q-title">${i + 1}. ${q.q}</div>
            <div class="options">
              ${q.options.map((opt, optIdx) => {
                let cls = "";
                if (optIdx === q.answer) cls = "correct-opt";
                else if (userAns === optIdx && userAns !== q.answer) cls = "wrong-opt";
                
                return `
                  <div class="${cls}">
                    ${optIdx === userAns ? "<strong>[Your Choice]</strong> " : ""}
                    ${optIdx === q.answer ? "<strong>[Correct Answer]</strong> " : ""}
                    ${opt}
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderAnswerTable() {
      const tbody = document.getElementById("ans-table-body");
      tbody.innerHTML = questions.map((q, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${q.options[q.answer]}</td>
        </tr>
      `).join('');
    }
  </script>
